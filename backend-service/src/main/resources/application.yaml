spring:
  application:
    name: backend-service

  datasource:
    url: jdbc:postgresql://localhost:5432/galaxy_photoz
    username: vadim
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

server:
  port: 8080

minio:
  endpoint: http://localhost:9000
  access-key: vadim
  secret-key: minio_password_123
  secure: false

app:
  upload:
    max-file-size: 10485760
    storage-path: /var/data/
    bucket-name: galaxy-photos
    allowed-file-types:
      - image/jpeg
      - image/png
      - image/fits
  rabbitmq:
    img-queue-name: astroml.img
    chart-queue-name: astroml.chart
    exchange-img: img_exchange
    exchange-chart: chart_exchange
    img-routing-key: img
    chart-routing-key: chart


